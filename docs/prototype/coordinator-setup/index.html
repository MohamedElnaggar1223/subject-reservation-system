<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinator set-up — clickable mock (COORDINATOR_REWORK.md, decision H2)</title>
<!--
  The clickable mock of decision H2 (COORDINATOR_REWORK.md): the coordinator's Home, Sessions, the Session page,
  the Subject editor, the family's Reserve page and the desk, on the June 2027 pre-load of §8. One file, no external
  requests, nothing saved. Teacher and student names are invented placeholders (the data rule: no real staff names in
  a committed file); the structure of §8 is kept (how many teachers each subject has, online, external team, to be
  confirmed, the same person across subjects).
  Colours are the product's tokens (apps/web/app/globals.css, light theme) and the status tones of
  components/ui/tone.tsx; no other palette.
-->
<style>
:root{
  --radius:.625rem;
  --background:oklch(0.982 0.004 80); --foreground:oklch(0.17 0.02 265);
  --card:oklch(1 0 0); --primary:oklch(0.44 0.11 178); --primary-foreground:oklch(0.99 0 0);
  --secondary:oklch(0.955 0.005 80); --muted:oklch(0.955 0.005 80); --muted-foreground:oklch(0.50 0.01 265);
  --accent:oklch(0.95 0.02 178); --accent-foreground:oklch(0.30 0.08 178);
  --destructive:oklch(0.55 0.22 25); --border:oklch(0.91 0.005 80); --input:oklch(0.91 0.005 80); --ring:oklch(0.44 0.11 178);
  --sidebar:oklch(0.20 0.04 220); --sidebar-foreground:oklch(0.90 0.01 220); --sidebar-primary:oklch(0.65 0.13 178);
  --sidebar-primary-foreground:oklch(0.20 0.04 220); --sidebar-accent:oklch(0.26 0.04 220); --sidebar-accent-foreground:oklch(0.95 0.01 220);
  --sidebar-border:oklch(0.30 0.04 220); --brand-100:oklch(0.92 0.06 178);
  /* components/ui/tone.tsx: emerald (done), amber (attention), red (refused), violet (information) — 50 / 200 / 700 */
  --ok-bg:oklch(0.979 0.021 166.113); --ok-bd:oklch(0.905 0.093 164.15); --ok-fg:oklch(0.508 0.118 165.612);
  --warn-bg:oklch(0.987 0.022 95.277); --warn-bd:oklch(0.924 0.12 95.746); --warn-fg:oklch(0.555 0.163 48.998);
  --bad-bg:oklch(0.971 0.013 17.38); --bad-bd:oklch(0.885 0.062 18.334); --bad-fg:oklch(0.505 0.213 27.518);
  --info-bg:oklch(0.969 0.016 293.756); --info-bd:oklch(0.894 0.057 293.283); --info-fg:oklch(0.491 0.27 292.581);
  --shadow-sm:0 1px 3px 0 oklch(0 0 0 / .1),0 1px 2px -1px oklch(0 0 0 / .1);
  --shadow-xl:0 20px 25px -5px oklch(0 0 0 / .1),0 8px 10px -6px oklch(0 0 0 / .1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);font:14px/1.5 "Plus Jakarta Sans","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:Tahoma,Arial,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
.h1{font-size:24px;font-weight:700;line-height:1.25}
.h2{font-size:18px;font-weight:600;line-height:1.35}
.h3{font-size:15px;font-weight:600}
.muted{color:var(--muted-foreground)}
.xs{font-size:12px}.sm{font-size:13px}.b{font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.top{align-items:flex-start}
.nowrap{flex-wrap:nowrap}
.stack>*+*{margin-top:16px}
.stack-sm>*+*{margin-top:6px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.grow{flex:1;min-width:0}
.warnText{color:var(--warn-fg)}.badText{color:var(--bad-fg)}.okText{color:var(--ok-fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* the mock's own chrome */
#mockbar{position:sticky;top:0;z-index:40;background:var(--foreground);color:var(--background);font-size:12px}
#mockbar .mb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 14px}
#mockbar .mb+.mb{border-top:1px solid oklch(1 0 0 / .12)}
#mockbar .tag{background:var(--sidebar-primary);color:var(--sidebar-primary-foreground);font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.06em}
#mockbar button,#mockbar select{background:transparent;border:1px solid oklch(1 0 0 / .28);color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}
#mockbar select option,#mockbar select optgroup{color:var(--foreground);background:var(--card)}
#mockbar [aria-pressed=true],#mockbar select.on{background:var(--sidebar-primary);color:var(--sidebar-primary-foreground);border-color:var(--sidebar-primary)}
#mockbar .where{font-weight:700}
#mockbar .dim{opacity:.6}

/* the product's shell (components/nav-shell.tsx) */
.shell{display:flex;min-height:calc(100vh - 64px)}
.side{width:256px;flex:none;background:var(--sidebar);color:var(--sidebar-foreground);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:20px 16px}
.logo{display:flex;width:36px;height:36px;flex:none;align-items:center;justify-content:center;border-radius:var(--radius);background:var(--sidebar-primary);color:var(--sidebar-primary-foreground);font-weight:700;font-size:13px}
.nav{padding:0 12px 16px}
.nav .sec{margin:20px 0 6px;padding:0 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:oklch(0.90 0.01 220 / .6)}
.nav button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;color:oklch(0.90 0.01 220 / .72);padding:8px 12px;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;text-align:start;margin-top:2px}
.nav button:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.nav button[aria-current=page]{background:var(--sidebar-primary);color:var(--sidebar-primary-foreground);box-shadow:var(--shadow-sm)}
.nav button:disabled{opacity:.45;cursor:default;background:transparent}
.nav svg{width:20px;height:20px;flex:none}
.sidefoot{margin-top:auto;border-top:1px solid var(--sidebar-border);padding:12px;display:flex;align-items:center;gap:12px}
.avatar{display:flex;width:32px;height:32px;flex:none;align-items:center;justify-content:center;border-radius:50%;background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-size:12px;font-weight:600}
.main{flex:1;min-width:0}
.mhead{display:none;height:56px;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--card);padding:0 16px;font-weight:700}
.mhead .logo{width:28px;height:28px;font-size:12px;background:var(--primary);color:var(--primary-foreground)}
.page{max-width:1280px;margin:0 auto;padding:32px 24px 64px}
@media (max-width:1023px){.side{display:none}.mhead{display:flex}.page{padding:20px 14px 48px}}

/* components (components/ui/*) */
.card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-sm);padding:20px}
.card.tight{padding:14px 16px}
.card.flat{background:var(--muted);box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--radius);font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:var(--primary);color:var(--primary-foreground)}
.btn:hover{background:oklch(0.44 0.11 178 / .9)}
.btn:disabled{opacity:.5;cursor:default}
.btn.outline{background:var(--background);border-color:var(--border);color:var(--foreground);box-shadow:0 1px 2px oklch(0 0 0 / .05)}
.btn.outline:hover{background:var(--accent);color:var(--accent-foreground)}
.btn.ghost{background:transparent;color:var(--foreground)}
.btn.ghost:hover{background:var(--accent);color:var(--accent-foreground)}
.btn.danger{background:var(--destructive);color:var(--primary-foreground)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:calc(var(--radius) - 2px)}
.btn.xs{height:26px;padding:0 9px;font-size:12px;border-radius:calc(var(--radius) - 4px)}
.link{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:3px;text-align:start}
.link.plain{color:var(--foreground);text-decoration:none}
.link.plain:hover{text-decoration:underline}
:focus-visible{outline:3px solid oklch(0.44 0.11 178 / .5);outline-offset:1px}
.input{height:40px;width:100%;border:1px solid var(--input);border-radius:var(--radius);background:var(--background);padding:0 12px;font-size:14px;box-shadow:0 1px 2px oklch(0 0 0 / .05)}
.input.s{height:34px;font-size:13px;padding:0 8px}
textarea.input{height:auto;padding:8px 12px;min-height:64px;resize:vertical;line-height:1.45}
.input:disabled{opacity:.55}
.fee{width:104px}
.field label,.lbl{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted-foreground);margin-top:4px}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:16px;height:16px;margin:0;vertical-align:middle;cursor:pointer;flex:none}
input:disabled{cursor:default}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--muted);color:var(--muted-foreground)}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg)}.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}.badge.bad{background:var(--bad-bg);color:var(--bad-fg)}.badge.info{background:var(--info-bg);color:var(--info-fg)}
.notice{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:12px 14px;font-size:13px;background:var(--muted)}
.notice.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}.notice.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
.notice.bad{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-bd)}.notice.info{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-bd)}
.mocknote{border:1px dashed var(--muted-foreground);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--muted-foreground);background:var(--card)}
.mocknote b{color:var(--foreground)}
.switch{position:relative;display:inline-flex;width:40px;height:22px;flex:none;border-radius:999px;border:0;background:var(--input);cursor:pointer;padding:0;transition:background .15s}
.switch .thumb{position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-sm);transition:inset-inline-start .15s}
.switch.on{background:var(--primary)}
.switch.on .thumb{inset-inline-start:20px}
.switch:disabled{opacity:.5;cursor:default}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.swlabel{font-size:14px;font-weight:500}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border)}
.tabs button{margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;padding:8px 16px;font-size:14px;font-weight:500;color:var(--muted-foreground);cursor:pointer}
.tabs button[aria-selected=true]{border-color:var(--primary);color:var(--foreground)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:oklch(0.955 0.005 80 / .45);color:var(--muted-foreground);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:bottom}
table.t td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top;text-align:start}
html[dir=rtl] table.t th,html[dir=rtl] table.t td{text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-sm);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile.off{background:var(--muted);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 6px 3px 10px;background:var(--card);font-size:13px}
.tog{border:1px solid var(--border);background:var(--background);border-radius:999px;font-size:11px;padding:1px 8px;cursor:pointer;color:var(--muted-foreground)}
.tog[aria-pressed=true]{background:var(--accent);color:var(--accent-foreground);border-color:var(--brand-100);font-weight:600}
.x{border:0;background:none;cursor:pointer;color:var(--muted-foreground);font-size:16px;line-height:1;padding:0 4px}
.x:hover{color:var(--foreground)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.check:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot.block{background:var(--bad-fg)}.dot.look{background:var(--warn-fg)}.dot.info{background:var(--muted-foreground)}
.modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:oklch(0 0 0 / .5);padding:16px}
.modal{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-xl)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:16px 24px}
.modal .mbody{padding:20px 24px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;background:var(--foreground);color:var(--background);padding:10px 16px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow-xl);max-width:90vw}
/* subject editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.pv{position:sticky;top:80px}
@media (max-width:1240px){.ed{grid-template-columns:1fr}.pv{position:static}}
table.grid td.c,table.grid th.c{text-align:center}
table.grid th.c label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}
table.grid th.c{width:66px;padding:8px 4px}
table.grid td.rowc{min-width:170px}
table.grid .fee{width:92px}
.tile .swl{white-space:nowrap}
table.grid tr.offrow td{color:var(--muted-foreground)}
table.grid tr.more td{background:oklch(0.955 0.005 80 / .55);border-top:0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);padding:2px;background:var(--card)}
.seg button{border:0;background:none;border-radius:calc(var(--radius) - 2px);padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted-foreground)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}
/* the family's page */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-sm);padding:16px}
.fcard.chosen{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.price{font-weight:600}
.optset{border:0;padding:0;margin-inline:0}
.optset legend{padding:0}
.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);margin-top:4px;font-size:13px;cursor:pointer;background:var(--card)}
.opt.on{border-color:var(--primary);background:var(--accent)}
.optdetail{padding:4px 10px 0}
.consent{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.consent input{margin-top:2px}
</style>
</head>

<script>
(function () {
'use strict';

/* ───────────────────────── Helpers ───────────────────────── */
const TODAY = '2026-10-26';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const n2 = (n) => Number(n).toLocaleString('en-US');
const MON = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON_S = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_AR = ['', 'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const day = (iso, lang) => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return lang === 'ar' ? `${d} ${MON_AR[m]} ${y}` : `${d} ${MON_S[m]} ${y}`; };
const ym = (k, lang) => { const [y, m] = k.split('-').map(Number); return `${lang === 'ar' ? MON_AR[m] : MON[m]} ${y}`; };
const ymShift = (k, years) => `${Number(k.slice(0, 4)) + years}${k.slice(4)}`;
const dShift = (iso, years) => (iso ? `${Number(iso.slice(0, 4)) + years}${iso.slice(4)}` : iso);
const monthsBetween = (a, b) => { const [ya, ma] = a.split('-').map(Number); const [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const clone = (o) => JSON.parse(JSON.stringify(o));
let seq = 100;
const nid = (p) => `${p}${++seq}`;
const money = (n, lang) => (n == null ? '' : lang === 'ar' ? `<span class="num" dir="ltr">${n2(n)}</span> جنيه` : `<span class="num" dir="ltr">EGP ${n2(n)}</span>`);
const moneyTxt = (n, lang) => (lang === 'ar' ? `${n2(n)} جنيه` : `EGP ${n2(n)}`);
const normCode = (s) => String(s).toUpperCase().replace(/\s+/g, ' ').trim();
const sumParts = (p) => Object.values(p).reduce((a, b) => a + b, 0);
const numOrNull = (v) => (v === '' || v == null ? null : Math.max(0, Number(v)));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + 's'}`;

/* ───────────────────────── Reference data (ours: §7) ───────────────────────── */
const BOARDS = {
  cambridge: { name: 'Cambridge', onePaperFee: 'syllabus', onePaperAsks: true, carryMonths: 13, deadlines: { '2027-06': '2027-02-21', '2028-06': '2028-02-21', '2027-11': '2027-09-15' } },
  edexcel: { name: 'Edexcel', onePaperFee: 'paper', onePaperAsks: false, carryMonths: null, deadlines: { '2027-06': '2027-02-21', '2028-06': '2028-02-21', '2027-11': '2027-09-21' } },
  oxford: { name: 'OxfordAQA', onePaperFee: 'syllabus', onePaperAsks: false, carryMonths: null, deadlines: {} },
};
const ALIASES = { cambridge: { '9608 SY': ['cam-9618', 'as'] }, edexcel: {}, oxford: {} };

function R(key, kind, en, ar, codes, extra) { return Object.assign({ key, kind, label: { en, ar }, codes: codes || [] }, extra || {}); }
const ALL = (code, extra) => R('all', 'all', 'All papers', 'كل الأوراق', code ? [code] : [], extra);
const P41 = () => R('p4', 'paper', 'Paper 41/42 only', 'الورقة 41/42 فقط', []);
const ROUTES = (c) => [R('as', 'as', 'A.S.', 'A.S.', c ? [c + ' AS'] : []), R('a2', 'a2', 'A.2.', 'A.2.', c ? [c + ' A2'] : []), R('al', 'al', 'A.L.', 'A.L.', c ? [c + ' AL'] : [])];
const UNITS = (list) => list.map(([key, short, code, req, winter]) => R(key, 'unit', `${short} (${code})`, `${short.replace('Unit', 'الوحدة')} (${code})`, [code], { required: !!req, winter }));

const REF = [
  { ref: 'cam-3180', board: 'cambridge', code: '3180', title: 'Arabic O.L.', group: 'OL', rows: [ALL('3180 A'), R('p1', 'paper', 'Paper 1 only', 'الورقة 1 فقط', []), R('p2', 'paper', 'Paper 2 only', 'الورقة 2 فقط', [])] },
  { ref: 'cam-0970', board: 'cambridge', code: '0970', title: 'Biology O.L.', group: 'OL', rows: [ALL('0970 CX'), P41()] },

const groupKey = (r) => (r.kind === 'all' || r.kind === 'paper' ? 'papers' : ['as', 'a2', 'al'].includes(r.kind) ? 'routes' : r.kind === 'qual' ? 'quals' : 'u:' + r.key);
function groupsOf(o) { const out = []; const by = {}; for (const r of o.rows) { if (!r.on || r.closed) continue; const k = groupKey(r); if (!by[k]) { by[k] = { key: k, rows: [] }; out.push(by[k]); } by[k].rows.push(r); } return out; }
function famOptions(sess, o, r, st, example) { const known = st.known[o.ref]; return ['fi', 'fs', 'ri', 'rs'].filter((k) => r.cells[k] && cellAllowed(r, k) && !(known && OPT[k].attempt === 'first')).map((k) => ({ k, price: priceOf(sess, o, r, k, example) })).filter((x) => x.price); }
function optLabel(sess, r, k, lang) { const base = OPT[k][lang]; if (OPT[k].mode === 'ss' && r.ssFee == null) return lang === 'ar' ? base.replace('دراسة ذاتية', `دراسة ذاتية ${sess.share}%`) : base.replace('self study', `self study ${sess.share}%`); return base; }
const rowOptText = (sess, r, k, lang) => `${r.label[lang]} · ${optLabel(sess, r, k, lang)}`;

    const many = g.rows.length > 1; const opts = [];
    for (const r of g.rows) for (const x of famOptions(sess, o, r, st, ctx.example)) opts.push({ r, k: x.k, price: x.price });
    if (!opts.length) continue;
    const p = picks[g.key]; if (p) chosen = true;
    const single = g.key.startsWith('u:');
    const label = single ? g.rows[0].label[lang] : many ? L.what : `${L.what} · ${g.rows[0].label[lang]}`;
    const nm = `pk-${ctx.scope}-${o.id}-${g.key}`;
    const optRow = (val, text, priceHtml, checked) => `<label class="opt${checked ? ' on' : ''}"><input type="radio" name="${esc(nm)}" value="${esc(val)}" data-chg="pick" data-scope="${esc(ctx.scope)}" data-o="${o.id}" data-g="${esc(g.key)}" ${checked ? 'checked' : ''}><span class="grow">${text}</span>${priceHtml}</label>`;
    body += `<fieldset class="optset mt12"><legend class="lbl">${esc(label)}</legend>${optRow('', `<span class="muted">${esc(L.notTaking)}</span>`, '', !p)}${opts.map((x) => {
      const ts = rowTeachers(o, x.r); const withT = x.r.teachers && ts.length === 1 && OPT[x.k].mode === 'school' ? ` · ${L.with} ${esc(tName(ts[0].tid))}` : '';
      return optRow(`${x.r.key}|${x.k}`, `${many ? `<b><bdi>${esc(x.r.label[lang])}</bdi></b> · ` : ''}${esc(optLabel(sess, x.r, x.k, lang))}${withT}`, `<span class="price nowrap">${money(x.price.total, lang)}${x.price.example ? ' ‡' : ''}</span>`, p && p.row === x.r.key && p.opt === x.k);

function pickDetails(sess, o, p, g, ctx, known) {

/* Prices tab */

function parsedView(s) {

  ${res.unused.length ? `<h3 class="h3 mt16">Not used <span class="muted">(${res.unused.length})</span></h3><div class="tablewrap mt8"><table class="t"><thead><tr><th>Line as printed</th><th>Why</th></tr></thead><tbody>${res.unused.map((u) => `<tr><td class="num">${esc(u.raw)}</td><td>${esc(u.why)}</td></tr>`).join('')}</tbody></table></div>` : ''}
  <div class="row mt12"><button class="btn" data-act="plUse" ${res.matched.length ? '' : 'disabled'}>Use these prices</button><span class="sm muted">One-paper rows that follow their subject, and sums of units, follow by themselves.</span></div></div>`;

function parseList(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\t/g, '  ').trim(); if (!line) continue;
    const m = line.match(/^(.*?)\s+(?:EGP\s*)?([0-9][0-9,]*(?:\.[0-9]+)?)\s*(?:EGP)?$/i);
    if (!m) { out.push({ raw: line, bad: true, codes: [] }); continue; }
    const amount = Number(m[2].replace(/,/g, '')); const rest = m[1].trim(); let codes = []; let name = rest;
    const pair = rest.match(/^([A-Z0-9]{3,6}(?:\s[0-9A-Z]{1,2})?)\s*\/\s*([A-Z0-9]{3,6}(?:\s[0-9A-Z]{1,2})?)\s+(.*)$/);

    else { const one = rest.match(/^([0-9]{4}\s[A-Z0-9]{1,2}(?=\s)|[0-9][A-Z]{2}[0-9]\s[0-9][A-Z](?=\s)|[A-Z0-9]{4,6})\s+(.*)$/); if (one) { codes = [one[1]]; name = one[2]; } }

function targetsFor(s, board, code) {

  for (const o of s.offerings) { if (o.board !== board) continue; for (const r of o.rows) { if (!r.on) continue;
    if (r.codes.map(normCode).includes(c) || (alias && alias[0] === o.ref && alias[1] === r.key)) out.push({ oid: o.id, rkey: r.key, title: o.title, label: r.label.en, old: r.examFee, ly: r.lastYear && !r.kept });
    else if (r.sumOf && r.sumOf.map(normCode).includes(c)) out.push({ oid: o.id, rkey: r.key, title: o.title, label: r.label.en, old: r.parts ? (r.parts[r.sumOf.find((x) => normCode(x) === c)] ?? null) : null, part: r.sumOf.find((x) => normCode(x) === c), ly: r.lastYear && !r.kept });
  } }
  return out;
}
function whyUnused(s, board, code) {
  const c = normCode(code);
  for (const R0 of REF) { if (R0.board !== board) continue; for (const r of R0.rows) if (r.codes.map(normCode).includes(c) || (r.sumOf || []).map(normCode).includes(c)) { const inS = offByRef(s, R0.ref); return inS ? `${R0.title}: its ${r.label.en} row is not ticked` : `${R0.title} is not offered in this session`; } }
  return 'not recognised: no subject on our lists has this code';
}
function matchList(s, board, text) {
  const matched = [], unused = [];
  for (const p of parseList(text)) {
    if (p.bad || !p.codes.length) { unused.push({ raw: p.raw, why: p.bad ? 'no amount read on this line' : 'no code read on this line' }); continue; }
    for (const code of p.codes) { const targets = targetsFor(s, board, code); if (targets.length) matched.push({ code, name: p.name, amount: p.amount, targets }); else unused.push({ raw: p.codes.length > 1 ? `${code} (on the line “${p.raw}”)` : p.raw, why: whyUnused(s, board, code) }); }

}
function applyList(ss, board, name, matched) {
  const id = nid('L'); ss.lists.push({ id, board, name, rows: matched.map((m) => [m.code, m.name, m.amount]) });
  for (const m of matched) for (const t of m.targets) {
    const o = ss.offerings.find((x) => x.id === t.oid); const r = o && o.rows.find((x) => x.key === t.rkey); if (!r) continue;
    if (t.part) { r.parts = r.parts || {}; r.parts[t.part] = m.amount; r.lastYear = false; r.kept = false; if (r.sumOf.every((x) => r.parts[x] != null)) { r.examFee = sumParts(r.parts); r.feeSrc = 'units_sum'; } }

function fillOptions(o, r) {

  for (const c of codesOf(o, r)) for (const l of allLists(o.board)) { const hit = l.rows.find((x) => normCode(x[0]) === normCode(c)); if (hit) out.push({ v: `copy:${l.id}:${hit[0]}`, label: `Copy from ${l.name}: ${moneyTxt(hit[2])}` }); }

}
function missingCard(s) {

    if (last) return `<div class="row"><span class="sm" style="width:170px">From week ${from}</span>${pct}<span class="sm muted">of the course fee back</span></div>`;
    const weeks = []; for (let w = from; w <= 20; w++) weeks.push(w);
    return `<div class="row"><span class="sm" style="width:58px">${i === 0 ? 'Up to' : 'Then to'}</span><select class="input s" style="width:104px" data-chg="refWeek" data-i="${i}" ${locked ? 'disabled' : ''} aria-label="Step ${i + 1}: up to week">${weeks.map((w) => `<option value="${w}" ${st.week === w ? 'selected' : ''}>week ${w}</option>`).join('')}</select>${pct}<span class="sm muted">of the course fee back</span>${!locked && s.refund.length > 2 ? `<button class="x" data-act="refDel" data-i="${i}" aria-label="Remove step ${i + 1}">×</button>` : ''}</div>`;
  }).join('');

  return `<section class="card"><h2 class="h3">Refund policy</h2><p class="sm muted mt4">Of the course fee, counted from the first lesson. Families read the sentence below, made from these rows, so the words and the money cannot disagree.</p>
  ${locked ? '<p class="mt8"><span class="badge info">Fixed: a family has agreed to it</span></p>' : ''}<div class="stack-sm mt12">${steps}</div>${locked ? '' : '<div class="row mt8"><button class="btn outline sm" data-act="refAdd">Add a step</button></div>'}
  <div class="notice mt12"><p class="sm"><b>Families read:</b> ${esc(refundConsent(s, 'en'))}</p><p class="sm mt4" dir="rtl" lang="ar">${esc(refundConsent(s, 'ar'))}</p></div></section>
  <section class="card mt16"><h2 class="h3">Declaration</h2><p class="sm mt8">“${DECL.en}”</p><p class="xs muted mt4">One text for the whole school, set by the admin; each family's agreement keeps a copy of it.</p></section>
  <section class="card mt16"><div class="grid-3">
   <div class="field"><label for="ag-share">Self study pays</label><select id="ag-share" class="input" data-chg="share">${shares.map((p) => `<option value="${p}" ${s.share === p ? 'selected' : ''}>${p}% of the course fee</option>`).join('')}</select><p class="hint">and the whole exam fee. Shown on every subject.</p></div>
   <div class="field"><span class="lbl">Grades that may reserve</span><div class="stack-sm">${[['g10', 'Grade 10'], ['g11', 'Grade 11'], ['g12', 'Grade 12'], ['grad', 'Graduates retaking']].map(([k, l]) => `<div class="swrow" style="max-width:250px"><span class="sm">${l}</span>${sw(s.grades[k], 'grade', `data-g="${k}"`, l)}</div>`).join('')}</div></div>
   <div class="field"><label for="ag-cancel">Unpaid reservations are cancelled</label><select id="ag-cancel" class="input" data-chg="cancelDays">${days.map((d) => `<option value="${d}" ${s.cancelDays === d ? 'selected' : ''}>${plural(d, 'day')} after the payment due date</option>`).join('')}</select><p class="hint">or at the board's deadline, if that is earlier. Reminders go before.</p></div>
  </div></section>${questionsCard(s)}`;

function gridRow(s, o, r, cols) {

function modal(title, body, foot, wide) { return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="${wide ? 'max-width:760px' : ''}"><div class="mh"><h2 class="h2">${esc(title)}</h2><button class="x" data-act="closeDialog" aria-label="Close">×</button></div><div class="mbody">${body}</div><div class="mf">${foot}</div></div></div>`; }
function layer() {
  const d = S.dialog; let h = '';

    else if (d.type === 'remove') { const o = S.edit.off; h = modal(`Remove ${o.title}`, `<p class="sm">${esc(o.title)} leaves ${sessName(s)}. Nobody has reserved it.</p>`, '<button class="btn outline" data-act="closeDialog">Cancel</button><button class="btn danger" data-act="confirmRemove">Remove</button>'); }

    else if (d.type === 'notList') h = modal('A subject not on the list', `<div class="grid-2"><div class="field"><label for="nl-board">Board</label><select id="nl-board" class="input" data-chg="nlBoard">${Object.entries(BOARDS).map(([k, b]) => `<option value="${k}" ${d.board === k ? 'selected' : ''}>${b.name}</option>`).join('')}</select></div><div class="field"><label for="nl-level">Group</label><select id="nl-level" class="input" data-chg="nlLevel"><option value="OL" ${d.level === 'OL' ? 'selected' : ''}>O.L.</option><option value="AS" ${d.level === 'AS' ? 'selected' : ''}>A.S./A.L.</option></select></div></div><div class="field mt12"><label for="nl-name">Subject name</label><input id="nl-name" class="input" data-chg="nlName" value="${esc(d.name)}" placeholder="e.g. Marine Science"></div><div class="field mt12"><label for="nl-code">Code <span class="muted">(optional)</span></label><input id="nl-code" class="input" data-chg="nlCode" value="${esc(d.code)}"></div><p class="hint mt8">Flagged to us: we add it to the reference with its rows and rules. It starts with ${d.level === 'OL' ? '“All papers”' : '“A.S.” and “A.L.”'}; you can add rows.</p>${d.err ? `<p class="notice bad mt8" role="alert">${esc(d.err)}</p>` : ''}`, '<button class="btn outline" data-act="closeDialog">Cancel</button><button class="btn" data-act="doNotOnList">Add and open</button>');
    else if (d.type === 'dup') h = modal('Is this someone already on the list?', `<p class="sm">“${esc(d.name)}” looks like:</p><div class="stack-sm mt12">${d.matches.map((id) => { const subs = S.sessions.flatMap((x) => x.offerings.filter((o) => o.teachers.some((t) => t.tid === id)).map((o) => o.title)); return `<label class="row sm"><input type="radio" name="dup" value="${id}" data-chg="dupPick" ${d.pick === id ? 'checked' : ''}> <b>${esc(tName(id))}</b> <span class="muted">— ${subs.length ? 'teaches ' + [...new Set(subs)].map(esc).join(', ') : 'on the school\'s list'}</span></label>`; }).join('')}<label class="row sm"><input type="radio" name="dup" value="__new" data-chg="dupPick" ${d.pick === '__new' ? 'checked' : ''}> No — add “${esc(d.name)}” as a new teacher</label></div><p class="hint mt8">Checked by spelling and initials, so one person is not listed twice.</p>`, '<button class="btn outline" data-act="closeDialog">Cancel</button><button class="btn" data-act="dupUse">Use this</button>');
  }
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  return h;
}

let toastTimer;
function toast(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2800); }
function goScreen(k) {
  if (k !== 'subject') S.edit = null;
  if (k === 'subject' && !S.edit) { const j = famSession(); openEditor(j.id, offByRef(j, 'cam-3180').id); return; }
  S.screen = k; S.dialog = null; window.scrollTo(0, 0);
}
function openEditor(sid, oid, isNew, draft) {
  const s = byId(sid); S.sessionId = sid;
  S.edit = { sid, off: draft || clone(s.offerings.find((o) => o.id === oid)), isNew: !!isNew, newOpen: false, newT: '', more: null, eq: { type: 'yesno', text: '', choices: '' }, cr: null, ssOwn: null };
  S.screen = 'subject'; S.dialog = null; window.scrollTo(0, 0);
}
const draftRow = (key) => S.edit.off.rows.find((r) => r.key === key);
const sortOfferings = (s) => { s.offerings = [...s.offerings.filter((o) => o.group === 'OL'), ...s.offerings.filter((o) => o.group !== 'OL')]; };
function offFor(scope, oid) { return scope.startsWith('pv:') ? S.edit.off : famSession().offerings.find((o) => o.id === oid); }
function scopeBox(scope) { return scope.startsWith('fam:') ? S.fam : scope.startsWith('desk:') ? S.desk : null; }

function addLines(s, scope, st, lines, status) {
